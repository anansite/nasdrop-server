services:
  nasdrop-server:
    image: ghcr.io/anansite/nasdrop-server:latest
    container_name: nasdrop-server
    restart: unless-stopped
    ports:
      - "8881:8881"
    volumes:
      - /mnt/merged/nas:/data
      - ./data:/config
    environment:
      - PORT=8881
      - DATA_DIR=/data
      - DB_PATH=/config/nasdrop.db
      - THUMB_DIR=/config/thumbnails
    deploy:
      resources:
        limits:
          memory: 256M
