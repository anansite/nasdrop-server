version: '3.8'

services:
  nasdrop-server:
    image: nasdrop-server:latest
    build: .
    container_name: nasdrop-server
    restart: always
    ports:
      - "8881:8881"
    volumes:
      - /mnt/merged/nas:/data
      - /mnt/sata1-4/Configs/nasdrop:/config
    environment:
      - PORT=8881
      - DATA_DIR=/data
      - DB_PATH=/config/nasdrop.db
      - THUMB_DIR=/config/thumbnails
    deploy:
      resources:
        limits:
          memory: 512M
